# Baseline configuration. Ablations extend this and override 1-3 keys.
name: base

llm:
  backend: ollama            # ollama | openai_compat (vLLM) | hf_local | mock
  model: qwen3:4b
  base_url: http://localhost:11434
  temperature: 0.0           # every eval run is greedy. Do not change for a "nicer" demo.
  max_tokens: 768
  max_retries: 2

retrieval:
  corpus_path: data/corpus.jsonl
  embed_model: BAAI/bge-small-en-v1.5
  store: numpy               # numpy | qdrant
  mode: hybrid               # hybrid | dense | bm25
  top_k: 5
  candidate_k: 30
  rrf_k: 60
  index_dir: data/index

agents:
  router: llm                # llm | lora | rules
  use_critic: true
  max_critic_rounds: 2
  max_tool_steps: 4
  single_agent: false

eval:
  golden_path: eval/golden.jsonl
  k: 5
  seed: 20260908
  runs_dir: runs
