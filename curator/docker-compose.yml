# Optional infrastructure. The repo runs end-to-end without any of this
# (retrieval.store: numpy, llm.backend: ollama), which is deliberate — a reviewer
# should be able to clone and run `make test` without starting a single container.
services:
  qdrant:
    image: qdrant/qdrant:v1.13.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # After first start:  docker compose exec ollama ollama pull qwen3:4b

volumes:
  qdrant_storage:
  ollama_models:
