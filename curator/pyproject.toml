[project]
name = "curator"
version = "0.1.0"
description = "Curator — a grounded, tool-using multi-agent conversational recommender with a reproducible evaluation harness."
requires-python = ">=3.11"
dependencies = [
    # agent orchestration
    "langgraph>=1.2.11,<2",
    "langchain-core>=1.6.2,<2",
    # tools / MCP  (NOTE: mcp 2.x renamed FastMCP -> MCPServer; this repo targets 2.x)
    "mcp>=2.2.0,<3",
    # retrieval
    "sentence-transformers>=6.0.1",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.19.0",
    "numpy>=1.26",
    # plumbing
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Only needed for the QLoRA router fine-tune (Weekend 2). Keep out of the default
# install so `make test` and CI stay light and CPU-only.
train = [
    "transformers>=5.16.1",
    "peft>=0.20.0",
    "trl>=1.12.0",
    "datasets>=5.0.1",
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.2",
    "torch>=2.6",
]
serve = ["vllm>=0.28.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
curator = "curator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
